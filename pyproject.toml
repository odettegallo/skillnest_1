[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plantilla-repositorio-base"
version = "0.1.0"
dependencies = [
    "langchain",
    "langchain-google-genai",
    "python-dotenv",
]

[tool.setuptools.package-dir]
"" = "src"

# En lugar de py-modules, le indicamos que busque los paquetes dentro de "src"
[tool.setuptools.packages.find]
where = ["src"]